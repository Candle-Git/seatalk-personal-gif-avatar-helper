<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src data:; connect-src 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SeaTalk 表情助手 · 我的表情预览</title>
<style>
body{margin:0;background:#edf2f8;color:#24354c;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:90px auto;padding:40px;background:#fff;border-radius:24px;box-shadow:0 14px 60px #14294a12}h1{font-size:30px}p{line-height:1.8;color:#586b83}button{font:inherit;padding:12px 22px;border-radius:10px;border:1px solid #0866c6;background:#0866c6;color:#fff;cursor:pointer;margin:6px}.pill{display:inline-block;padding:6px 12px;border-radius:100px;background:#e8f2ff;color:#0866c6}.toolbar-left{display:flex;align-items:center;gap:4px}.icon-container{line-height:32px}.demo-composer .toolbar{margin-top:8px}#preview-note{position:fixed;bottom:0;left:0;right:0;background:#142b47;color:white;padding:8px 20px;font-size:12px;z-index:2147483647;pointer-events:none}
</style>
<main><h1>SeaTalk 表情助手</h1><p>用备注搜索收藏，预览所选表情，或生成分享口令。</p><button id="showFavorites">预览「我的表情」</button><p>本页使用示例收藏与模拟聊天，可体验筛选、多选和分享。</p></main>
<div class="sealabs-stickers-panel"><div class="sealabs-sticker"></div></div>
<div id="preview-note">界面预览 · 示例数据 · 未连接真实账号</div>
<script>window.__SPGA_TEST_MODE__=true;window.GM_setValue=()=>{};window.unsafeWindow=window;</script>
<script src="../SeaTalk-Personal-GIF-Avatar-Helper.user.js"></script>
<script>
const params = new URLSearchParams(location.search);
const locale = params.get('lang') === 'en' ? 'en' : 'zh';
const text = (zh, en) => locale === 'en' ? en : zh;
const chatName = text('示例聊天', 'Demo conversation');
document.documentElement.lang = locale;
document.title = text('SeaTalk 表情助手 · 我的表情预览', 'SeaTalk Sticker Helper · My stickers preview');
const intro = document.querySelector('main');
intro.querySelector('h1').textContent = text('SeaTalk 表情助手', 'SeaTalk Sticker Helper');
intro.querySelector('p').textContent = text('搜索、分组和分享收藏表情。', 'Search, group and share your favorite stickers.');
intro.querySelector('p:last-child').textContent = text('本页使用示例收藏和模拟聊天。', 'Try these sample favorites in a demo conversation.');
const showButton = document.getElementById('showFavorites');
showButton.textContent = text('预览「我的表情」', 'Open My stickers');
document.getElementById('preview-note').textContent = text('界面预览 · 示例数据', 'Interface preview · Sample data');
const demoLayout = params.get('split') === '1';
if (demoLayout) {
 intro.remove();
 const sheet=document.createElement('style');sheet.textContent=`
 #root{position:fixed;inset:0;background:linear-gradient(135deg,#e5edf5,#f7f4ef)}.home-app,.page-container{height:100%}.home-default-page{height:100%;display:flex;align-items:center;justify-content:center}.home-main-window{width:1024px;height:800px;background:#fff;display:flex;border-radius:7px;overflow:hidden;box-shadow:0 4px 24px #17203316}.demo-rail{width:68px;flex-shrink:0;background:#e8eef5;padding:24px 12px;font-size:24px;display:flex;flex-direction:column;gap:30px}.demo-chats{width:260px;flex-shrink:0;background:#f8fafc;border-right:1px solid #e4e7ec;padding:20px 12px}.demo-chat-item{padding:16px 12px;border-radius:8px;margin:10px 0;color:#667085}.demo-chat-item.active{background:#e6f1ff;color:#0866c6}.demo-thread{min-width:0;flex:1;display:flex;flex-direction:column}.demo-thread header{padding:20px;border-bottom:1px solid #e4e7ec;font-weight:600}.demo-messages{padding:28px;flex:1;overflow:auto}.demo-bubble{max-width:70%;padding:14px 16px;border-radius:12px;background:#f2f4f7;line-height:1.7;font-size:14px;margin:20px 0}.demo-bubble.mine{margin-left:auto;background:#e6f1ff;color:#0866c6}.demo-composer{margin:16px;padding:16px;border:1px solid #d0d5dd;border-radius:10px;min-height:100px;color:#98a2b3;font-size:14px}.demo-caption{font-size:12px;color:#98a2b3;padding:0 20px 12px}.home-main-window p{font-size:13px}.demo-chats strong{font-size:16px}@media(max-width:1024px),(max-height:800px){.home-main-window{width:100%;height:100%}}`;
 document.head.append(sheet);
 const frame=document.createElement('div');
 frame.id='root';
 frame.innerHTML=`<div class="home-app"><div class="page-container"><div class="home-default-page loggedIn"><div class="home-main-window hbox">
   <aside class="demo-rail" aria-hidden="true"><span>💬</span><span>👥</span><span>⚙</span></aside>
   <aside class="demo-chats"><strong>SeaTalk</strong><div class="demo-chat-item active">${chatName}</div><div class="demo-chat-item">${text('项目讨论','Project chat')}</div></aside>
   <section class="demo-thread"><header class="messages-message-detail-view-header"><span class="title-wrap"><span class="title">${chatName}</span></span></header>
   <div class="demo-messages"><div class="demo-bubble">${text('打开助手，在右侧整理收藏。','Open the helper to organize favorites on the right.')}</div></div>
   <div class="demo-composer messages-message-editor">${text('模拟聊天输入区','Demo chat composer')}</div></section>
 </div></div></div></div>`;
 document.body.prepend(frame);
} else {
 const header = document.createElement('div');
 header.className = 'messages-message-detail-view-header';
 header.innerHTML = `<span class="title-wrap"><span class="title">${chatName}</span></span>`;
 const composer = document.createElement('div');
 composer.className = 'messages-message-editor';
 intro.append(header,composer);
}
const composer = document.querySelector('.messages-message-editor');
composer.insertAdjacentHTML('beforeend','<div class="toolbar"><div class="toolbar-left"><span class="icon-container" aria-hidden="true">☺</span></div></div>');
if (demoLayout) composer.append(showButton);
const emojis=['🐱','🐸','🐶','🐼','🐰','🦊','🐹','🐨','🐯','🦄','🐥','🐵'];
const chineseLabels=['猫猫点头','悲伤蛙','小狗开心','熊猫打招呼','兔兔加油','狐狸问号','仓鼠吃饭','考拉摸鱼','老虎冲鸭','独角兽开心','小鸡早安','猴猴跳舞'];
const labels=locale==='en'?['Nodding cat','Sad frog','Happy dog','Hello panda','Go rabbit','Curious fox','Eating hamster','Koala break','Go tiger','Happy unicorn','Morning chick','Dancing monkey']:chineseLabels;
const demo=Array.from({length:60},(_,n)=>{const id='a'.repeat(33)+'b0705'+String(n).padStart(26,'0');return {id,url:'https://f.haiserve.com/download/'+id+'_300',name:labels[n%12]+(n>=12?' '+(Math.floor(n/12)+1):'')}});
let list=demo;
const seed=document.querySelector('.sealabs-sticker');
const listeners=new Set(), messages={};
const notify=()=>{for(const listener of listeners) listener();};
const fileUrl=id=>'https://f.haiserve.com/download/'+id+'_300';
const actions={
  actionRemoveCustomStickers(ids) {
    list=list.filter(row=>!ids.includes(row.id));
    seed.__reactFiber$preview.memoizedProps.stickers=list;
    notify();
  },
  actionAddCustomStickerFromMessage({content}) {
    if (!list.some(row=>row.id===content.fileId)) {
      list.push({id:content.fileId,url:fileUrl(content.fileId),name:text('收到的表情','Shared sticker')});
      notify();
    }
  }
};
seed.__reactFiber$preview={memoizedProps:{stickers:list,isCustomTab:true},return:{memoizedProps:{actions}}};
let sentCount=0;
window.__SPGA_SHARE_FIXTURE_SERVICES__={
  actions,session:{loggedIn:true,userId:1},tag:'fixture-sticker',fileUrl,
  store:{
    getState:()=>({messages:{customStickers:list,messages,selectedSession:{id:42,type:'group'}},contact:{groupInfo:{42:{name:chatName}}}}),
    subscribe(fn){listeners.add(fn);return ()=>listeners.delete(fn);}
  },
  previewDimensions:()=>({width:170,height:170}),
  sendSticker({customSticker}){
    const sequence=++sentCount, cid='demo-'+sequence;
    messages['group-42-'+cid]={cid,mid:sequence.toString(16).padStart(16,'0'),serverTimeStamp:Date.now(),senderId:1,tag:'fixture-sticker',content:{fileId:customSticker.url}};
    const chat=document.querySelector('.demo-messages');
    if (chat) {
      const bubble=document.createElement('div');
      bubble.className='demo-bubble mine';
      bubble.textContent=text('演示表情 ','Demo sticker ')+sequence;
      chat.append(bubble);
    }
    notify();
  }
};
let settings={schema:2,revision:0,items:[],groups:[]};
window.__SPGA_PERSONAL_SETTINGS_FIXTURE__={request(request){
  if(request.kind==='save'){
    if(request.revision!==settings.revision) throw Error('METADATA_CHANGED');
    settings={schema:2,revision:settings.revision+1,items:request.items,groups:request.groups};
  }
  return settings;
}};
window.GM_getValue=()=>({locale,lastSeenUpdateNoticeVersion:'5.3.0'});

function decorate(root) {
  for(const image of root.querySelectorAll('img')){
    const id=image.src.match(/\/download\/([a-zA-Z0-9]{64})_300/)?.[1];
    if(!id) continue;
    const index=Number(id.slice(-26))%emojis.length;
    const fill=['#f1f6ff','#fff4ed','#f0f8f3'][index%3];
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="240" height="180"><rect width="240" height="180" rx="16" fill="${fill}"/><text x="120" y="115" text-anchor="middle" font-size="84">${emojis[index]}</text></svg>`;
    image.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  }
}
const decoratedRoots=new WeakSet();
function attachArtwork() {
  for(const id of ['st-favorites-curator','st-quick-stickers']){
    const root=document.getElementById(id)?.shadowRoot;
    if(!root || decoratedRoots.has(root)) continue;
    decoratedRoots.add(root);
    decorate(root);
    new MutationObserver(()=>decorate(root)).observe(root,{childList:true,subtree:true});
  }
}
new MutationObserver(attachArtwork).observe(document.body,{childList:true});
window.__SPGA_TEST_API__.init();
function showFavorites(){
  const host=document.getElementById('st-favorites-curator');
  if(host?.dataset.open==='true') return;
  let quick=document.getElementById('st-quick-stickers');
  if(!quick){
    document.getElementById('spga-quick-toggle')?.click();
    quick=document.getElementById('st-quick-stickers');
  }
  quick?.shadowRoot.querySelector('#manage')?.click();
  attachArtwork();
}
showButton.addEventListener('click',showFavorites);
showFavorites();
</script></html>
